services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chillcheck
      POSTGRES_PASSWORD: chillcheck
      POSTGRES_DB: chillcheck
    ports:
      - "5432:5432"
    volumes:
      - chillcheck_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chillcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chillcheck_pgdata:
